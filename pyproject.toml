[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infer3d"
version = "1.0.0"
description = "Infer3D: 3D Reconstruction through Inverse Generative Modelling"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Runtime dependencies are pinned in requirements.txt; the CUDA Gaussian rasterizer and
# the external generator repositories are not pip-installable and are configured through
# infer3d/config.py. Installing this package is optional -- `PYTHONPATH=.` is enough.
dependencies = []

[tool.setuptools]
packages = ["infer3d", "infer3d.data", "infer3d.utils"]
